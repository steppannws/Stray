name: Stray
options:
  bundleIdPrefix: com.stepan
  deploymentTarget:
    macOS: "14.0"
targets:
  Stray:
    type: application
    platform: macOS
    sources: [Stray]
    info:
      path: Stray/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stray
        LSUIElement: true # menu bar only, no Dock icon
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "Stray asks Finder to empty the Trash on your behalf when you reclaim disk space."
    settings:
      base:
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Stray/Resources/Stray.entitlements
        # No App Sandbox on purpose: we need to list all of the user's processes
        ENABLE_APP_SANDBOX: false
  StrayTests:
    type: bundle.unit-test
    platform: macOS
    sources: [StrayTests]
    dependencies:
      - target: Stray
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: true
schemes:
  Stray:
    build:
      targets:
        Stray: all
        StrayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StrayTests]
